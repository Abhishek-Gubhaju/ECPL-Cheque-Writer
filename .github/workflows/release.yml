name: Release

on:
  push:
    tags:
      - "v1.0.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS build (Intel + Apple Silicon)
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          
          # Windows x64 build
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
            rust_targets: "x86_64-pc-windows-msvc"
          
          # Linux x64 build
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            rust_targets: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uploaded by hand? This names every missing file before any build runs.
      # scripts/expected-files.txt is the full manifest of the working export.
      - name: Verify project layout
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const core = [
              "package.json", "package-lock.json", "index.html", "vite.config.ts", "tsconfig.json",
              "src/main.ts", "src/App.vue", "src/store.ts",
              "src-tauri/Cargo.toml", "src-tauri/Cargo.lock", "src-tauri/build.rs",
              "src-tauri/tauri.conf.json", "src-tauri/src/main.rs",
              "src-tauri/capabilities/default.json",
              "src-tauri/icons/AppIcon.png", "src-tauri/icons/AppIcon.icns",
              "src-tauri/icons/icon.ico", "src-tauri/icons/app-icon.svg",
            ];
            const manifest = "scripts/expected-files.txt";
            const expected = fs.existsSync(manifest)
              ? fs.readFileSync(manifest, "utf8").split("\n").map((s) => s.trim()).filter(Boolean)
              : [];
            const required = [...new Set([...core, ...expected])];
            const missing = required.filter((f) => !fs.existsSync(f));
            const tracked = require("child_process").execSync("git ls-files")
              .toString().split("\n").filter(Boolean).length;
            console.log(`Repository has ${tracked} tracked files; ${expected.length} expected.`);
            if (missing.length) {
              console.error(`\nMISSING ${missing.length} FILE(S):`);
              missing.forEach((f) => console.error("  - " + f));
              process.exit(1);
            }
            console.log("Project layout OK");
          '

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            rpm \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only cut a release for tag pushes; manual runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('ECPL Cheque Writer {0}', github.ref_name) || '' }}
          releaseBody: |
            ## ECPL Cheque Writer ${{ github.ref_name }}
            
            Initial release of the ECPL Cheque Writer application.
            
            ### Installation
            - **macOS**: Download the `.dmg` file.
            - **Windows**: Download the `-setup.exe` or `.msi` file.
            - **Linux**: Download the `.AppImage` or `.deb` file.
            
            Please see the README for detailed installation instructions regarding unsigned apps.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ strategy.job-index }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
